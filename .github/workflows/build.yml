name: Build e publica a imagem

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Define o nome da imagem
        id: docker_image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/$IMAGE_NAME:$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Configura o QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compila e publica a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          provenance: false
          tags: ${{ steps.docker_image.outputs.tag }}
